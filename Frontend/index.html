<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: #2c2c3e;
            padding: 40px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input {
            padding: 10px;
            width: 70%;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Chatroom</h1>
        <p>Welcome to the chatroom project.</p>

        <input type="text" placeholder="Enter message">
        <br>
        <button>Send</button>
    </div>

</body>
</html>
